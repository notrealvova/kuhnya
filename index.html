/* VOICE: тёплый домашний помощник, без давления — «по вайбу», а не по граммам
   IDEA: кухонная доска с карточками рецептов и магнитами — набор недели, а не расписание
   PICTURE: шкалы недели для обоих + карточки блюд набора, как магниты на холодильнике
   COLOUR and TYPE: базиликовый зелёный поле, томатный акцент, белая бумага; Unbounded + Manrope
   LAYOUT: мобильный столбец до 760px, нижняя навигация, листы снизу для деталей */
:root{color-scheme:light dark;
 --bg:light-dark(#f6f5f1,#111613);--card:light-dark(#ffffff,#1a211d);--ink:light-dark(#18201b,#ecf1ed);--mute:light-dark(#5d6a62,#9aa89f);
 --line:light-dark(#e4e2da,#2a342e);--basil:light-dark(#1f4a37,#173a2b);--basil2:light-dark(#2d6a4f,#4f9c76);--leaf:light-dark(#e3efe7,#1d3328);
 --tom:light-dark(#e2452c,#ff6a4f);--tomsoft:light-dark(#fde6e0,#3a1f19);--sun:light-dark(#f2b33d,#f2b33d);--sunsoft:light-dark(#fdf1d8,#33290f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip;padding-bottom:84px}
h1,h2,h3{font-family:Unbounded,Manrope,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:22px}h2{font-size:19px}h3{font-size:16px;font-weight:500}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{background:var(--basil);color:#f3f7f4;padding:14px 0 18px;border-radius:0 0 22px 22px}
.toprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--leaf);color:var(--basil2);white-space:nowrap}
.tag.tt{background:var(--tomsoft);color:var(--tom)}.tag.soup{background:var(--sunsoft);color:light-dark(#8a5a00,#f2b33d)}

.ritem .t{flex:1}.ritem .t b{display:block;line-height:1.3}.ritem .t span{font-size:13px;color:var(--mute)}
.shoph{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:end}

.srow:first-of-type{border-top:0}
.cb{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;font-size:20px;color:transparent}
.srow.got .cb{background:var(--basil2);border-color:var(--basil2);color:#fff}
.srow.got .n,.srow.home .n{text-decoration:line-through;opacity:.55}
.srow .n b{display:block;font-size:15px;line-height:1.3}.srow .n span{font-size:13px;color:var(--mute)}
.srow .p{text-align:right;white-space:nowrap;font-weight:700;font-size:14px}
.srow .p .pr{font-size:14px;font-weight:700;color:var(--ink);text-decoration:none;margin:0 0 0 auto;min-height:32px}.srow .p .own{display:block;font-size:11px;color:var(--basil2);font-weight:700}
.srow .p button{display:block;margin-top:2px;margin-left:auto;font-size:12px;color:var(--mute);text-decoration:underline;min-height:28px}
.srow.home .p button{color:var(--basil2);font-weight:700}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs div{display:flex;max-width:760px;width:100%}
nav.tabs button{flex:1;height:64px;font-size:12px;font-weight:700;color:var(--mute);display:grid;place-items:center;align-content:center;gap:2px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current=page]{color:var(--basil2)}
.sheet{position:fixed;inset:0;z-index:10;display:none}
.sheet.open{display:block}
.sheet .bg{position:absolute;inset:0;background:rgba(10,15,12,.5)}
.sheet .pane{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 16px 28px;max-width:760px;margin:0 auto}
.pane .close{position:sticky;top:0;float:right;width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:22px;z-index:2}
.pane h2{margin:4px 50px 12px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
td:first-child,th:first-child{text-align:left}
th{font-weight:700;color:var(--mute);font-size:12px}
.ing{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:15px}
.ing span:nth-child(2n){text-align:right;color:var(--mute);white-space:nowrap}
ol.steps{padding-left:22px;margin:8px 0}ol.steps li{margin-bottom:8px}
.field{display:grid;gap:4px;margin-bottom:10px;font-size:14px;color:var(--mute)}
.field input,.field select{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:16px;color:var(--ink)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;display:none;z-index:20;gap:12px;align-items:center;max-width:92vw}
.toast.show{display:flex}.toast button{color:var(--sun);font-weight:800;min-height:32px}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
.note{font-size:13px;color:var(--mute)}
.eye{background:var(--sunsoft);border-radius:14px;padding:12px;font-size:14px}

:root{--vova:light-dark(#7a1f2b,#c98a6a);--vovasoft:light-dark(#efe4dc,#2e1f19);--kris:light-dark(#e0a600,#f5c63b);--krissoft:light-dark(#fdf3d3,#3a3112);--krisink:light-dark(#6b4e00,#f5c63b)}
.pv{--me:var(--vova);--mesoft:var(--vovasoft);--meink:var(--vova)}.pk{--me:var(--kris);--mesoft:var(--krissoft);--meink:var(--krisink)}
.pp{border-top:5px solid var(--me)}.pp h3 span:first-child{color:var(--meink)}
.pp .bar{background:var(--mesoft)}.pp .bar i{background:var(--me)}.pp .bar.over i{background:var(--tom)}
.pp .hint{background:var(--mesoft)}
.who button[data-w=v][aria-pressed=true]{background:#7a1f2b;color:#fff}
.who button[data-w=k][aria-pressed=true]{background:#f5c63b;color:#3d2c00}
.who button[data-w=v]::before,.who button[data-w=k]::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:1px}
.who button[data-w=v]::before{background:#a0503a}.who button[data-w=k]::before{background:#f5c63b}
.mebox{border-left:5px solid var(--me)}
.day[aria-pressed=true]{background:var(--me);border-color:var(--me);color:light-dark(#fff,#111)}
.pk .day[aria-pressed=true]{color:#3d2c00}
.qb.plan{border-color:var(--me);background:var(--mesoft)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pc{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 10px;border-radius:12px;background:var(--leaf);color:var(--ink);font-size:14px;font-weight:700;line-height:1.2;text-align:left;border:2px solid transparent}
.pc.tt{background:var(--tomsoft)}.pc.soup{background:var(--sunsoft)}.pc.bf{background:var(--card);border-color:var(--line)}
.pool .pc{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.pool .pc[aria-pressed=true]{border-color:var(--ink)}
.pc em{font-style:normal;font-weight:600;font-size:12px;color:var(--mute)}
.cal{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}

.qline{display:grid;grid-template-columns:minmax(0,2fr) 76px minmax(0,1.3fr);gap:6px;margin-bottom:8px}.qline select,.qline input{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 8px;font-size:16px;color:var(--ink);width:100%}

.tag.kris{background:var(--kris);color:#3d2c00}
.tag.user{background:var(--sunsoft);color:var(--ink)}
.tag.vova{background:var(--vova);color:#fff}

<header class="top"><div class="wrap">
 <div class="toprow"><h1>Кухня на двоих</h1><button class="iconbtn" data-act="settings" aria-label="Настройки">⚙</button></div>
 <div class="who" id="who"></div>
 <div class="weeknav"><button class="iconbtn" data-act="wk" data-d="-1" aria-label="Прошлая неделя">‹</button><div class="lbl" id="wklbl"></div><button class="iconbtn" data-act="wk" data-d="1" aria-label="Следующая неделя">›</button></div>
 <div id="banner"></div>
</div></header>
<main class="wrap" id="main"></main>
<nav class="tabs"><div id="tabs"></div></nav>
<div class="sheet" id="sheet"><div class="bg" data-act="close"></div><div class="pane" id="pane"></div></div>
<div class="toast" id="toast"></div>

<script>
// ===== Продукты: КБЖУ на 100 г, цена, меры «на глаз» =====
// u: [[формы: одна, несколько(2-4/дробь), много], грамм]
const SP = [['ст.л.','ст.л.','ст.л.'],['ч.л.','ч.л.','ч.л.']];
const ING = {
 breast:{n:'Куриное филе (грудка)',g:'meat',k:[113,23.6,1.9,0.4],kg:560,u:[[['филе','филе','филе'],250]],hint:'1 филе ≈ половинка грудки'},
 thigh:{n:'Филе бедра без кости',g:'meat',k:[170,19,10.5,0],kg:480,u:[[['бедро','бедра','бёдер'],100]]},

  steps:['Картошку не чистить: помыть и нарезать дольками, смешать с ложкой масла, паприкой и солью.','Бедро нарезать, натереть аджикой и солью. В аэрогриль сначала картошку на 10 минут при 190 °C, потом добавить бедро и ещё 18–20 минут.','Подлива из ТикТока: на сковороде лук и тёртая морковка 5 минут, ложка муки, 2 ложки томатной пасты, стакан воды, соль, щепотка сахара — тушить 10 минут.']},
 {id:'kotl',cat:'main',src:'own',n:'Куриные котлеты + гречка + овощи',time:'~50 мин',

  steps:['Натереть луковицу, смешать с фаршем, яйцом, 3 ложками манки или овсянки, солью, перцем, чесноком. Дать постоять 5 минут.','Мокрыми руками сформовать котлеты размером с ладонь. Аэрогриль 180 °C, 15–18 минут, в два захода.','Гречку сварить в кастрюле.','Овощную смесь потушить на сковороде с 2–3 ложками воды под крышкой ~10 минут, посолить.','Соус: сметана + чеснок + капля острого.']},
 {id:'pasta',cat:'main',src:'own',n:'Паста с курицей в остром томатном соусе + салат',time:'~35 мин',

  K:[['breast',200],['pasta',90],['tpaste',20],['hot',5],['cheese',10],['cuc',70],['tom',100],['oil',4],['garlic',5],...T],
  steps:['Поставить вариться макароны. Перед тем как слить воду, отлить стакан.','Курицу нарезать кубиками, обжарить на сковороде с ложкой масла 7–8 минут.','Добавить чеснок, томатную пасту, острый соус и полстакана воды от макарон, тушить 5 минут.','Смешать с макаронами, сверху тёртый сыр. Салат: огурцы и помидоры, соль, ложка масла или сметаны.']},
 {id:'teri',cat:'main',src:'own',cook:'v',n:'Курица терияки с макаронами',time:'~30 мин',
  H:[['breast',180],['carr',60],['pepper',50],['teriyaki',30],['sesame',3],['oil',5],['pasta',85]],
  steps:['Поставить вариться макароны.','Курицу нарезать кубиками или полосками, морковку — соломкой, перец (если есть настроение) — полосками.','На сковороде с ложкой масла обжарить курицу 5–6 минут до золотистой корочки, добавить морковку и перец, ещё 3–4 минуты.','Влить соус терияки — примерно 2 ложки на порцию, кто любит погуще — больше, прогреть 2 минуты, чтобы соус загустел.','Смешать с макаронами или выложить сверху, посыпать щепоткой кунжута.'],tip:'Перец — по ситуации: без него блюдо почти не меняется по калориям.'},

 {id:'syrk',cat:'main',src:'tt',n:'Курица под сырной корочкой + гречка',time:'~35 мин',

 {id:'med',cat:'main',src:'tt',n:'Медово-горчичная курица с рисом',time:'~35 мин',

 {id:'shash',cat:'main',src:'tt',n:'Куриные шашлычки на шпажках + рис',time:'~30 мин + маринад',

 {id:'fil',cat:'main',src:'tt',n:'Куриное филе с овощами + рис',time:'~30 мин',

 {id:'bed',cat:'main',src:'tt',n:'Куриные бёдра с картошкой',time:'~40 мин',

 {id:'ind',cat:'main',src:'tt',n:'Котлеты из индейки с картошкой',time:'~40 мин',

 {id:'gol',cat:'main',src:'tt',n:'Ленивые голубцы в томатно-сметанном соусе',time:'~1 ч (40 мин тушатся сами)',

 {id:'min',cat:'main',src:'tt',n:'Минтай под сырной корочкой с помидорами + рис',time:'~45 мин',

 {id:'hek',cat:'main',src:'tt',n:'Хек по-польски + картошка в мундире',time:'~35 мин',

 {id:'pod',cat:'main',src:'tt',n:'Мясная подлива из свинины + гречка + огурцы',time:'~1 ч (45 мин тушится сама)',

 {id:'bak',cat:'main',src:'tt',n:'Баклажаны-лодочки с фаршем + рис',time:'~50 мин',

 {id:'k_goul2',cat:'main',src:'own',n:'Рагу с картошкой',time:'~1 ч',

 {id:'k_cod',cat:'main',src:'own',n:'Треска по-польски с пюре',time:'~40 мин',

 {id:'k_tsalad',cat:'main',src:'own',n:'Салат с тунцом и рисом',time:'~20 мин',

function dayTotals(list){const v=[0,0,0,0],k=[0,0,0,0];const ad=(t,a,m)=>a.forEach((x,i)=>t[i]+=x*m);
 for(const id of list){const d=D[id];if(!d)continue;
  ad(v,portion(d,'v'),1);ad(k,portion(d,'k'),1)}
 return {v,k}}
function planSummary(days){
 const tot={v:[0,0,0,0],k:[0,0,0,0]};let n=0;
 for(const i in days){const t=dayTotals(days[i]);n+=days[i].length;for(const w of ['v','k'])t[w].forEach((x,j)=>tot[w][j]+=x)}
 if(!n)return '';
 const c=cfg();
 const card=w=>{const T=c.targets[w].map(x=>x*7),t=tot[w];const diff=t[0]-T[0];const avgMain=650*(w==='v'?1:KF);
  const adv=Math.abs(diff)<T[0]*0.05?'По плану неделя почти точно в норме.':diff<0?`Не хватает ≈ ${fmt(-diff)} ккал — это примерно ${Math.max(1,Math.round(-diff/avgMain))} ${plural(Math.max(1,Math.round(-diff/avgMain)),['порция','порции','порций'])} основного.`:`Перебор ≈ ${fmt(diff)} ккал — можно убрать ${Math.max(1,Math.round(diff/avgMain))} ${plural(Math.max(1,Math.round(diff/avgMain)),['порцию','порции','порций'])} или выпечку.`;
  return `<div class="card p${w}"><h3 style="color:var(--meink);margin-bottom:6px">${esc(c.names[w])} по плану</h3>
  <div class="row"><span>Калории за неделю</span><b>${fmt(t[0])} / ${fmt(T[0])}</b></div>
  <div class="row"><span>В среднем в день</span><b>${fmt(t[0]/7)} ккал</b></div>
  <div class="row"><span>Б · Ж · У за неделю</span><b>${R(t[1])} · ${R(t[2])} · ${R(t[3])} г</b></div>
  <div class="row"><span>Норма Б · Ж · У</span><b>${R(T[1])} · ${R(T[2])} · ${R(T[3])} г</b></div>
  <div class="bar" style="margin:8px 0"><i style="width:${pct(t[0],T[0])}%"></i></div><div class="note">${adv}</div></div>`};
 return `<div class="psum">${card('v')}${card('k')}</div><p class="note" style="margin:8px 2px 0">Как считается: всё, что стоит в дне, — порция обоим (у Кристины порция ${cfg().kf}% от Вовиной), выпечка — по штуке. Едите 3 раза в день, так что на день ставь завтрак и 2 блюда (обед и ужин). Перекусы и «своё» здесь не считаются — они в дневнике.</p>`;
}

function localDump(){const out={};const add=(c,id,o)=>{(out[c]=out[c]||{})[id]=o};
 for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||!k.startsWith('k2:'))continue;let v;try{v=JSON.parse(localStorage.getItem(k))}catch(e){continue}
  let m=k.match(/^k2:d:([^/]+)\/(.+)$/);if(m&&v){add(m[1],m[2],v);continue}
  m=k.match(/^k2:c:(.+)$/);if(m&&v&&typeof v==='object')for(const id in v)add(m[1],id,v[id])}
 return out}

  if(RE.id)store.setDoc('recipes/'+RE.id,doc);else store.add('recipes',doc);closeSheet();toast('Рецепт сохранён — он уже в пуле недели')}
 else if(a==='opt'){const id=t.dataset.id,k=+t.dataset.k,i=+t.dataset.i;const cur=(S.var[id]||[]).slice();const n=D[id].opts.length;while(cur.length<n)cur.push(0);cur[k]=i;S.var[id]=cur;VAR=S.var;store.setDoc('variants/main',{v:S.var});render();refreshSheet()}
 else if(a==='toplan'){placeDish(t.dataset.id,+t.dataset.i,'pool');toast('Поставлено на '+DOW[+t.dataset.i])}
 else if(a==='day'){S.day=+t.dataset.i;render()}
 else if(a==='mult'){S.mult=+t.dataset.v;render()}
 else if(a==='addd'){const d=D[t.dataset.id];addLog(dname(d),portion(d,S.who).map(x=>x*S.mult),multTxt())}
 else if(a==='adds'){const s=SNACKS.find(x=>x.id===t.dataset.id);addLog(s.n,macros(s.items,S.mult),multTxt())}
 else if(a==='addc'){const c=S.custom.find(x=>x.id===t.dataset.id);if(c)addLog(String(c.label),[c.kcal,c.p,c.f,c.c].map(x=>(+x||0)*S.mult),multTxt()||'своё')}
 else if(a==='del'){const id=t.dataset.id;const e=S.log.find(x=>x.id===id);store.del('log',id);if(e)toast('Удалено: '+e.label,()=>{const c=Object.assign({},e);delete c.id;store.add('log',c)})}
 else if(a==='rf'){S.rf=t.dataset.v;render()}
 else if(a==='got'){const id=t.dataset.id;if(S.shop.got[id])delete S.shop.got[id];else S.shop.got[id]=true;saveShop()}
 else if(a==='home'){const id=t.dataset.id;if(S.shop.home[id])delete S.shop.home[id];else S.shop.home[id]=true;saveShop()}
 else if(a==='builder'){B={items:[],name:'',save:false};openSheet(builderView)}
 else if(a==='badd'){const id=$('#bp').value,n=parseFloat(String($('#bn').value).replace(',','.'))||0,u=$('#bu').value;if(n<=0)return;
  const it=ALL[id];let g,txt;if(u==='g'){g=n;txt=n+(it.ml?' мл':' г')}else{const un=it.u[+u];g=n*un[1];txt=String(n).replace('.',',')+' '+(Number.isInteger(n)?plural(n,un[0]):un[0][1])+' ≈ '+grams(g,it.ml)}
  B.name=$('#bname').value;B.save=$('#bsave').checked;B.items.push({id,g,txt});B.cur=id;refreshSheet()}
 else if(a==='brm'){B.name=$('#bname').value;B.save=$('#bsave').checked;B.items.splice(+t.dataset.i,1);refreshSheet()}
 else if(a==='bdone'){const name=($('#bname').value||'Своё блюдо').trim().slice(0,80);const m=macros(B.items.map(x=>[x.id,x.g]));addLog(name,m,'своё');
  if($('#bsave').checked)store.add('custom',{label:name,kcal:R(m[0]),p:R(m[1]),f:R(m[2]),c:R(m[3])});closeSheet()}
 else if(a==='manual')openSheet(manualView);
 else if(a==='mdone'){const name=($('#mn').value||'Без названия').trim().slice(0,80);const num=id=>parseFloat(String($(id).value).replace(',','.'))||0;const m=[num('#mk'),num('#mp'),num('#mf'),num('#mc')];if(!m[0]){$('#mk').focus();return}addLog(name,m,'вручную');if($('#msave').checked)store.add('custom',{label:name,kcal:m[0],p:m[1],f:m[2],c:m[3]});closeSheet()}
 else if(a==='export'){doExport()}
 else if(a==='accadd'){const v=($('#accin').value||'').trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){toast('Впишите почту целиком, например name@gmail.com');return}
  if(OWNERS().includes(v)||(S.access||[]).includes(v)){toast('Эта почта уже в списке');return}
  saveAccess([...(S.access||[]),v]).then(()=>toast('Доступ открыт: '+v))}
 else if(a==='accdel'){const v=t.dataset.e;saveAccess((S.access||[]).filter(x=>x!==v)).then(()=>toast('Доступ закрыт: '+v,()=>saveAccess([...(S.access||[]),v])))}
 else if(a==='importv'){openSheet(importView)}
 else if(a==='dl'){saveExport()}
 else if(a==='dl0'){const b=new Blob([EXP],{type:'application/json'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download='kuhnya-'+todayKey()+'.json';document.body.appendChild(l);l.click();setTimeout(()=>{URL.revokeObjectURL(u);l.remove()},1000)}
 else if(a==='cp'){const ta=$('#expta');ta.select();try{navigator.clipboard.writeText(ta.value).then(()=>toast('Скопировано'),()=>{document.execCommand('copy');toast('Скопировано')})}catch(e){document.execCommand('copy');toast('Скопировано')}}
 else if(a==='doimp'){doImport($('#impta').value)}
 else if(a==='logout'){closeSheet();firebase.auth().signOut()}
 else if(a==='sdone'){const num=id=>parseFloat(String($(id).value).replace(',','.'))||0;const s={names:{v:$('#nv').value.trim().slice(0,30)||DEFAULTS.names.v,k:$('#nk').value.trim().slice(0,30)||DEFAULTS.names.k},targets:{v:[0,1,2,3].map(i=>num('#tv'+i)),k:[0,1,2,3].map(i=>num('#tk'+i))},budget:num('#bud')||DEFAULTS.budget,kf:Math.min(150,Math.max(20,num('#kf')||DEFAULTS.kf))};S.settings=s;store.setDoc('settings/main',s);closeSheet();render();toast('Сохранено')}
});
document.addEventListener('change',ev=>{if(ev.target.id==='rp'){RE.cur=ev.target.value;$('#rqu').innerHTML=qUnits(RE.cur);return}if(ev.target.id==='rc'){keepRE();refreshSheet();return}if(ev.target.id==='qp'){S.qp=ev.target.value;$('#qu').innerHTML=qUnits(S.qp);return}if(ev.target.id==='bp'){B.cur=ev.target.value;B.name=$('#bname').value;B.save=$('#bsave').checked;refreshSheet()}});
document.addEventListener('input',ev=>{if(ev.target.id==='rq'){S.rq=ev.target.value;render()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&sheetOpen)closeSheet()});

// ---------- запуск ----------
subscribeAll();render();
// ---------- отдельная версия: Firebase ----------
function loginView(err){return `<div style="max-width:360px;margin:12vh auto 0;padding:0 20px"><h1 style="font-family:Unbounded,system-ui;font-size:26px;margin:0 0 6px">Кухня на двоих</h1><p class="note" style="margin:0 0 18px">Войдите своим Google-аккаунтом.</p>
 <button class="btn pri" data-act="glogin" type="button" style="width:100%;justify-content:center;gap:10px"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Войти через Google</button>
 <div id="lerr" style="color:#c0392b;min-height:20px;font-size:14px;margin-top:10px">${err||''}</div>
 </div>`}
const authErr=e=>{const c=e&&e.code||'';return /popup-closed|cancelled-popup/.test(c)?'':/network/.test(c)?'Нет связи с Firebase. VPN включён?':/invalid|wrong|user-not-found/.test(c)?'Неверная почта или пароль':/too-many/.test(c)?'Слишком много попыток, подождите минуту':/unauthorized-domain/.test(c)?'Этот адрес сайта не разрешён в настройках Firebase':'Не получилось войти: '+c};
function gLogin(){const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});const el=$('#lerr');if(el)el.textContent='';
 firebase.auth().signInWithPopup(p).catch(e=>{const c=e&&e.code||'';if(/popup-blocked|operation-not-supported/.test(c))return firebase.auth().signInWithRedirect(p);const t=authErr(e);if(el)el.textContent=t})}
document.addEventListener('click',ev=>{if(ev.target.closest&&ev.target.closest('[data-act=glogin]'))gLogin()});
function showLogin(err){let el=$('#login');if(!el){el=document.createElement('div');el.id='login';el.style.cssText='position:fixed;inset:0;z-index:999;background:var(--bg,Canvas);overflow:auto';document.body.appendChild(el)}el.innerHTML=loginView(err)}
function hideLogin(){const el=$('#login');if(el)el.remove()}
document.addEventListener('submit',ev=>{if(ev.target.id!=='lf')return;ev.preventDefault();const b=ev.target.querySelector('button');b.disabled=true;$('#lerr').textContent='';
 firebase.auth().signInWithEmailAndPassword($('#le').value.trim(),$('#lp').value).catch(e=>{b.disabled=false;$('#lerr').textContent=authErr(e)})});
async function fbBoot(){
 if(!window.FB_CONFIG||!FB_CONFIG.apiKey||/ВСТАВЬ/.test(FB_CONFIG.apiKey)){showLogin('Не заполнен config.js — вставьте туда настройки Firebase.');return}
 firebase.initializeApp(FB_CONFIG);
 const fs=firebase.firestore();
 try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
 S.fb=true;
 firebase.auth().getRedirectResult().catch(e=>{const t=authErr(e);if(t)setTimeout(()=>{const el=$('#lerr');if(el)el.textContent=t},300)});
 firebase.auth().onAuthStateChanged(u=>{
  if(!u){unsubs.forEach(x=>{try{x()}catch(e){}});wkUnsubs.forEach(x=>{try{x()}catch(e){}});unsubs=[];wkUnsubs=[];store=Local;DB=null;S.mode='local';S.user=null;showLogin();return}
  hideLogin();S.user=u.email;DB=fs;store=Remote;S.mode='db';
  loadTimer=setTimeout(()=>{stale=true;banner()},10000);
  subscribeAll();render();
 });
}
(async()=>{
 try{
  if(window.firebase&&window.FB_CONFIG!==undefined){await fbBoot();return}
  const use=window.claude&&window.claude.use;if(!use)return;
  const db=await window.claude.use('db');if(!db)return;
  DB=db;store=Remote;S.mode='db';
  loadTimer=setTimeout(()=>{stale=true;banner()},10000);
  subscribeAll();render();
 }catch(e){console.warn(e)}
})();
}
