<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кухня</title>
<meta name="theme-color" content="#7a1f2b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Кухня">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: тёплый домашний помощник, без давления — «по вайбу», а не по граммам
   IDEA: кухонная доска с карточками рецептов и магнитами — набор недели, а не расписание
   PICTURE: шкалы недели для обоих + карточки блюд набора, как магниты на холодильнике
   COLOUR and TYPE: базиликовый зелёный поле, томатный акцент, белая бумага; Unbounded + Manrope
   LAYOUT: мобильный столбец до 760px, нижняя навигация, листы снизу для деталей */
:root{color-scheme:light dark;
 --bg:light-dark(#f6f5f1,#111613);--card:light-dark(#ffffff,#1a211d);--ink:light-dark(#18201b,#ecf1ed);--mute:light-dark(#5d6a62,#9aa89f);
 --line:light-dark(#e4e2da,#2a342e);--basil:light-dark(#1f4a37,#173a2b);--basil2:light-dark(#2d6a4f,#4f9c76);--leaf:light-dark(#e3efe7,#1d3328);
 --tom:light-dark(#c0391f,#ff6a4f);--tomsoft:light-dark(#fde6e0,#3a1f19);--sun:light-dark(#f2b33d,#f2b33d);--sunsoft:light-dark(#fdf1d8,#33290f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip;padding-bottom:84px}
h1,h2,h3{font-family:Unbounded,Manrope,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:22px}h2{font-size:19px}h3{font-size:16px;font-weight:500}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{background:var(--basil);color:#f3f7f4;padding:14px 0 18px;border-radius:0 0 22px 22px}
.toprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toprow h1{flex:1;color:#fff}
.iconbtn{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-size:20px;display:grid;place-items:center}
.who{display:flex;background:rgba(0,0,0,.22);border-radius:14px;padding:4px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.who button{flex:1 0 auto;min-width:96px;padding:0 12px;height:40px;border-radius:11px;color:#d6e6dc;font-weight:700;white-space:nowrap}
.who button[aria-pressed=true]{background:#fff;color:var(--basil)}
.weeknav{display:flex;align-items:center;gap:8px;margin-top:12px}
.weeknav .lbl{flex:1;text-align:center;font-weight:700}
.weeknav .lbl small{display:block;font-weight:500;opacity:.8;font-size:13px}
.banner{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--sunsoft);color:var(--ink);font-size:14px}
main{padding-top:16px}
section{margin-bottom:22px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 10px}
.sh p{margin:0;color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.grid{display:grid;gap:10px}
.prog{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.pp h3{display:flex;justify-content:space-between;gap:8px}
.big{font-family:Unbounded,sans-serif;font-size:clamp(26px,7vw,34px);font-weight:700;line-height:1;margin:8px 0 4px}
.big small{font-size:14px;font-weight:500;color:var(--mute);font-family:Manrope,sans-serif}
.bar{height:10px;border-radius:6px;background:var(--leaf);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--basil2);transition:width .4s}
.bar.over i{background:var(--tom)}
.mac{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;font-size:13px;color:var(--mute)}
.mac .bar{height:6px;margin-top:3px}
.hint{margin-top:10px;padding:8px 10px;border-radius:10px;background:var(--leaf);font-size:14px}
.dish{display:grid;gap:8px;position:relative}
.dish .tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--leaf);color:var(--basil2);white-space:nowrap}
.tag.tt{background:var(--tomsoft);color:var(--tom)}.tag.soup{background:var(--sunsoft);color:light-dark(#8a5a00,#f2b33d)}
.dish h3{font-size:16px}
.kb{font-size:14px;color:var(--mute)}
.kb b{color:var(--ink);font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--basil2);border-color:var(--basil2);color:#fff}
.btn.tom{background:var(--tom);border-color:var(--tom);color:#fff}
.btn.done{background:var(--leaf);border-color:var(--leaf);color:var(--basil2)}
.btn.sm{min-height:36px;font-size:14px;padding:0 10px}
.dish.cooked{border-color:var(--basil2)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;min-height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{display:block;font-weight:500;font-size:12px;opacity:.75;line-height:1}
.day{min-width:52px;padding:6px 8px}
.entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry .t{flex:1}.entry .t small{display:block;color:var(--mute);font-size:13px}
.entry .k{font-weight:800;white-space:nowrap}
.x{width:36px;height:36px;border-radius:10px;color:var(--mute);font-size:20px}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:8px}
.qb{text-align:left;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);min-height:56px}
.qb b{display:block;font-size:14px;line-height:1.25}.qb span{font-size:13px;color:var(--mute)}
.qb:active{transform:scale(.98)}
.search{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:16px}
.rlist{display:grid;gap:8px}
.ritem{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.ritem .t{flex:1}.ritem .t b{display:block;line-height:1.3}.ritem .t span{font-size:13px;color:var(--mute)}
.shoph{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:end}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.cb{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;font-size:20px;color:transparent}
.srow.got .cb{background:var(--basil2);border-color:var(--basil2);color:#fff}
.srow.got .n,.srow.home .n{text-decoration:line-through;opacity:.55}
.srow .n b{display:block;font-size:15px;line-height:1.3}.srow .n span{font-size:13px;color:var(--mute)}
.srow .p{text-align:right;white-space:nowrap;font-weight:700;font-size:14px}
.srow .p .pr{font-size:14px;font-weight:700;color:var(--ink);text-decoration:none;margin:0 0 0 auto;min-height:44px}.srow .p .own{display:block;font-size:12px;color:var(--basil2);font-weight:700}
.srow .p button{display:block;margin-top:2px;margin-left:auto;font-size:12px;color:var(--mute);text-decoration:underline;min-height:44px}
.srow.home .p button{color:var(--basil2);font-weight:700}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs div{display:flex;max-width:760px;width:100%}
nav.tabs button{flex:1;height:64px;font-size:12px;font-weight:700;color:var(--mute);display:grid;place-items:center;align-content:center;gap:2px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current=page]{color:var(--basil2)}
.sheet{position:fixed;inset:0;z-index:10;display:none}
.sheet.open{display:block}
.sheet .bg{position:absolute;inset:0;background:rgba(10,15,12,.5)}
.sheet .pane{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 16px 28px;max-width:760px;margin:0 auto}
.pane .close{position:sticky;top:0;float:right;width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:22px;z-index:2}
.pane h2{margin:4px 50px 12px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
td:first-child,th:first-child{text-align:left}
th{font-weight:700;color:var(--mute);font-size:12px}
.ing{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:15px}
.ing span:nth-child(2n){text-align:right;color:var(--mute);white-space:nowrap}
ol.steps{padding-left:22px;margin:8px 0}ol.steps li{margin-bottom:8px}
.field{display:grid;gap:4px;margin-bottom:10px;font-size:14px;color:var(--mute)}
.field input,.field select{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:16px;color:var(--ink)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;display:none;z-index:20;gap:12px;align-items:center;max-width:92vw}
.toast.show{display:flex}.toast button{color:var(--sun);font-weight:800;min-height:32px}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
.note{font-size:13px;color:var(--mute)}
.eye{background:var(--sunsoft);border-radius:14px;padding:12px;font-size:14px}

:root{--vova:light-dark(#7a1f2b,#c98a6a);--vovasoft:light-dark(#efe4dc,#2e1f19);--kris:light-dark(#e0a600,#f5c63b);--krissoft:light-dark(#fdf3d3,#3a3112);--krisink:light-dark(#6b4e00,#f5c63b)}
.pv{--me:var(--vova);--mesoft:var(--vovasoft);--meink:var(--vova)}.pk{--me:var(--kris);--mesoft:var(--krissoft);--meink:var(--krisink)}
.pp{border-top:5px solid var(--me)}.pp h3 span:first-child{color:var(--meink)}
.pp .bar{background:var(--mesoft)}.pp .bar i{background:var(--me)}.pp .bar.over i{background:var(--tom)}
.pp .hint{background:var(--mesoft)}
.mebox{border-left:5px solid var(--me)}
.day[aria-pressed=true]{background:var(--me);border-color:var(--me);color:light-dark(#fff,#111)}
.pk .day[aria-pressed=true]{color:#3d2c00}
.qb.plan{border-color:var(--me);background:var(--mesoft)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pc{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 10px;border-radius:12px;background:var(--leaf);color:var(--ink);font-size:14px;font-weight:700;line-height:1.2;text-align:left;border:2px solid transparent}
.pc.tt{background:var(--tomsoft)}.pc.soup{background:var(--sunsoft)}.pc.bf{background:var(--card);border-color:var(--line)}
.pool .pc{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.pool .pc[aria-pressed=true]{border-color:var(--ink)}
.pc em{font-style:normal;font-weight:600;font-size:12px;color:var(--mute)}
.cal{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
@media(min-width:880px){.wrap.wide{max-width:1180px}.cal{grid-template-columns:repeat(7,minmax(0,1fr))}.cal .dz{min-height:220px;flex-direction:column}}
.dz{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;align-content:flex-start;min-height:60px;border:2px dashed var(--line);border-radius:14px;padding:8px;background:var(--card);text-align:left;width:100%}
.dz h4{margin:0 6px 0 0;font:700 14px/40px Manrope,sans-serif;min-width:62px;color:var(--mute)}
.cal .dz h4{width:auto}
.dz.today{border-style:solid;border-color:var(--basil2)}.dz.today h4{color:var(--basil2)}
.dz.target{border-style:solid;border-color:var(--sun);background:var(--sunsoft)}
.dz.hot{border-color:var(--tom);background:var(--tomsoft)}
.dz .pc{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.dz .pc button{width:26px;height:26px;border-radius:8px;color:var(--mute);font-size:17px;line-height:1;position:relative}.dz .pc button::after{content:'';position:absolute;inset:-9px}
.dz .empty{font-size:13px;line-height:40px;padding:0}
.dk{width:100%;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--mute);margin-top:2px}.dk span{white-space:nowrap}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}.dot.v{background:var(--vova)}.dot.k{background:var(--kris)}
.psum{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));margin-top:12px}
.psum .card{border-left:5px solid var(--me)}.psum .bar{background:var(--mesoft)}.psum .bar i{background:var(--me)}.psum .row{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}.psum .row b{white-space:nowrap}
.qline{display:grid;grid-template-columns:minmax(0,2fr) 76px minmax(0,1.3fr);gap:6px;margin-bottom:8px}.qline select,.qline input{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 8px;font-size:16px;color:var(--ink);width:100%}
.exline{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;margin-bottom:8px}.exline input{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 10px;font-size:16px;color:var(--ink);width:100%}.exline #exn{grid-column:1/-1}
@media(max-width:420px){.qline{grid-template-columns:minmax(0,1fr) 70px}.qline select#qu{grid-column:1/-1}}
.cooktag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:99px;margin-left:4px;white-space:nowrap;line-height:1.6}.cooktag.v{background:var(--vova);color:#fff}.cooktag.k{background:var(--kris);color:#3d2c00}
.tag.kris{background:var(--kris);color:#3d2c00}
.tag.user{background:var(--sunsoft);color:var(--ink)}
.tag.vova{background:var(--vova);color:#fff}
.mhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}.mhead b{flex:1;text-align:center;font-size:17px}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.mcal .dw{text-align:center;font-size:12px;font-weight:700;color:var(--mute);padding:4px 0}
.mday{aspect-ratio:1/1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:800;font-size:15px;display:grid;place-items:center;align-content:center;gap:0;line-height:1.1}
.mday small{font-size:10px;font-weight:700}.mday.out{opacity:.35}.mday.today{outline:2px solid var(--basil2);outline-offset:1px}
.mday.v{background:var(--vova);border-color:var(--vova);color:#fff}.mday.k{background:var(--kris);border-color:var(--kris);color:#3d2c00}
.dzh{width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.vbtn{min-height:44px;padding:0 10px;border-radius:10px;border:1px dashed var(--line);font-size:12px;font-weight:700;color:var(--mute)}
.dz.vday{background:var(--vova);border:2px solid var(--vova)}.dz.vday h4{color:#fff}.dz.vday .vbtn{background:#fff;color:var(--vova);border:0}
.dz.vday .dk{color:#f3e6e1}.dz.vday .dk .dot.v{background:#fff}.dz.vday .empty{color:#f3e6e1}
.dz.vday.today{outline:3px solid var(--basil2);outline-offset:2px}
@media(min-width:880px){.dzh{flex-direction:column;align-items:flex-start}}
.party{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.bal{position:absolute;bottom:-90px;aspect-ratio:4/5;border-radius:50% 50% 48% 48%;box-shadow:inset -6px -8px 0 rgba(0,0,0,.12);animation:balup var(--d) ease-in forwards}
.bal::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:40px;background:rgba(0,0,0,.25)}
@keyframes balup{to{transform:translate(var(--x),-120vh) rotate(8deg)}}
.cf{position:absolute;top:75%;width:9px;height:14px;border-radius:2px;animation:cf 1.9s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes cf{0%{transform:translate(0,0) rotate(0)}70%{opacity:1}100%{transform:translate(var(--tx),var(--ty)) rotate(var(--r));opacity:0}}
.ghost{position:fixed;pointer-events:none;z-index:30;transform:translate(-50%,-60%) rotate(-3deg);box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:.95}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
@media(max-width:420px){.row4{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* v2: цвета людей задаются через --pc/--pcon */
.who button[aria-pressed=true]{background:var(--pc,#fff);color:var(--pcon,var(--basil))}
.who button::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:1px;background:var(--pc)}
.who button[aria-pressed=true]::before{background:var(--pcon)}
.dot{background:var(--pc)}
.cooktag{background:var(--pc);color:var(--pcon)}
.mday.c{background:var(--pc);border-color:var(--pc);color:var(--pcon)}
.dz.cday{background:var(--pc);border:2px solid var(--pc)}.dz.cday h4{color:var(--pcon)}.dz.cday .vbtn{background:var(--pcon);color:var(--pc);border:0}
.dz.cday .dk,.dz.cday .empty{color:var(--pcon);opacity:.85}.dz.cday .dk .dot{box-shadow:0 0 0 1.5px var(--pcon)}.dz.cday.today{outline:3px solid var(--basil2);outline-offset:2px}
.day[aria-pressed=true]{color:var(--pcon,#fff)}
.ritem .dot{margin-right:8px}
.arow{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 0;border-bottom:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}.arow>span:first-child{flex:1;word-break:break-all}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.addrow input{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 12px;font:inherit}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid transparent}.swatch[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}
.linkbtn{font-size:13px;font-weight:700;color:var(--meink);text-decoration:underline;text-underline-offset:3px;min-height:44px}
label.chip{display:inline-flex;align-items:center;gap:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{min-height:44px;border-radius:11px;font-weight:800;font-size:15px;color:var(--mute)}.seg button[aria-pressed=true]{background:var(--basil,#2f5d4a);color:#fff}
.chip small{opacity:.6;font-weight:700;margin-left:2px}

function renderPlanner(){

 const cal=DOW.map((dn,i)=>{const list=days[i]||[];
  const dt=dayTotals(list);
  const dk=iso(addDays(m,i)),cw=S.cook[dk]&&ppl().some(p=>p.id===S.cook[dk])?P(S.cook[dk]):null,q=cookQ();

  return `<div class="dz${colored?' cday':''}${cur&&i===ti?' today':''}${S.pick?' target':''}" data-drop="${i}"${colored?` style="${pv(cw)}"`:''}><div class="dzh"><h4>${dn} ${addDays(m,i).getDate()}${cw&&!colored?cookTag(dk):''}</h4>${btn}</div>${list.map((id,j)=>D[id]?`<span class="pc ${pcCls(D[id])}" data-drag="${id}" data-from="${i}:${j}">${esc(short(D[id]))}<button data-act="unplace" data-i="${i}" data-j="${j}" aria-label="Убрать">×</button></span>`:'').join('')||'<span class="empty">свободно</span>'}${list.length?`<div class="dk">${ppl().map(p=>`<span style="${pv(p)}"><i class="dot"></i>${fmt(dt[p.id][0])}</span>`).join('')}<span>ккал</span></div>`:''}</div>`}).join('');
 return `<section><div class="sh"><h2>План недели</h2><button class="btn sm" data-act="month">Месяц: кто готовит</button></div>

 <div class="cal">${cal}</div>
 ${planSummary(days)}

}

function dayTotals(list){const t={};ppl().forEach(p=>t[p.id]=[0,0,0,0]);
 for(const id of list){const d=D[id];if(!d)continue;for(const p of ppl())portion(d,p.id).forEach((x,i)=>t[p.id][i]+=x)}
 return t}
function planSummary(days){
 const tot={};ppl().forEach(p=>tot[p.id]=[0,0,0,0]);let n=0;
 for(const i in days){const t=dayTotals(days[i]);n+=days[i].length;for(const w in t)t[w].forEach((x,j)=>tot[w][j]+=x)}
 if(!n)return '';
 const card=p=>{const T=p.tg.map(x=>x*7),t=tot[p.id];const diff=t[0]-T[0];const avgMain=650*p.f;
  const adv=Math.abs(diff)<T[0]*0.05?'По плану неделя почти точно в норме.':diff<0?`Не хватает ≈ ${fmt(-diff)} ккал — это примерно ${Math.max(1,Math.round(-diff/avgMain))} ${plural(Math.max(1,Math.round(-diff/avgMain)),['порция','порции','порций'])} основного.`:`Перебор ≈ ${fmt(diff)} ккал — можно убрать ${Math.max(1,Math.round(diff/avgMain))} ${plural(Math.max(1,Math.round(diff/avgMain)),['порцию','порции','порций'])} или выпечку.`;
  return `<div class="card pp" style="${pv(p)}"><h3 style="color:var(--meink);margin-bottom:6px">${esc(p.name)} по плану</h3>
  <div class="row"><span>Калории за неделю</span><b>${fmt(t[0])} / ${fmt(T[0])}</b></div>
  <div class="row"><span>В среднем в день</span><b>${fmt(t[0]/7)} ккал</b></div>
  <div class="row"><span>Б · Ж · У за неделю</span><b>${R(t[1])} · ${R(t[2])} · ${R(t[3])} г</b></div>
  <div class="row"><span>Норма Б · Ж · У</span><b>${R(T[1])} · ${R(T[2])} · ${R(T[3])} г</b></div>
  <div class="bar" style="margin:8px 0"><i style="width:${pct(t[0],T[0])}%"></i></div><div class="note">${adv}</div></div>`};
 return `<div class="psum">${ppl().map(card).join('')}</div><p class="note" style="margin:8px 2px 0">Как считается: всё, что стоит в дне, — порция каждому (размер порции — по его норме, ${ppl().map(p=>esc(p.name)+' '+R(p.f*100)+'%').join(', ')}), выпечка — по штуке. На день ставь завтрак и 2 блюда (обед и ужин). Перекусы и «своё» здесь не считаются — они в дневнике.</p>`;
}

 return `<h2>Кто готовит</h2><p class="note">Нажимай на день — по очереди: ${PP.map(p=>esc(p.name)).join(' → ')} → снять отметку. Отметки общие и видны в плане недели.</p>
 <div class="mhead"><button class="iconbtn" style="background:var(--card);color:var(--ink);border:1px solid var(--line)" data-act="mon" data-d="-1" aria-label="Прошлый месяц">‹</button><b>${MN[mo]} ${y}</b><button class="iconbtn" style="background:var(--card);color:var(--ink);border:1px solid var(--line)" data-act="mon" data-d="1" aria-label="Следующий месяц">›</button></div>

 ev.preventDefault();drag.g.style.left=ev.clientX+'px';drag.g.style.top=ev.clientY+'px';

function priceInfo(id){if(!ALL[id])return {pack:1,price:0,kg:0,own:false};const it=ALL[id],o=S.prices[id]||{};if(it.pack)return {pack:+o.pack||it.pack[0],price:o.price!=null?+o.price:it.pack[1],own:o.price!=null||o.pack!=null};return {kg:o.price!=null?+o.price:it.kg,own:o.price!=null}}
function buyApp(id,g){
 const it=ALL[id];
 const pi=priceInfo(id),q=S.shop.qty&&S.shop.qty[id];
 if(it.pack){const pg=pi.pack,pc=pi.price;const name=(it.packName&&!S.prices[id]?.pack)?it.packName:'уп. '+grams(pg,it.ml);
  if(q!=null)return {txt:String(q).replace('.',',')+' × '+name,cost:R(q*pc),own:pi.own,q:1,n:q};
  if(it.last)return {txt:'1 уп. — хватит на несколько недель',cost:R(Math.min(1,g/pg)*pc),own:pi.own,n:1};
  const n=Math.max(1,Math.ceil(g/pg-0.12));return {txt:n+' × '+name,cost:n*pc,own:pi.own,n}}
 const kg=q!=null?q:Math.max(0.1,Math.ceil(g/100)/10);return {txt:String(kg).replace('.',',')+' кг',cost:R(kg*pi.kg),own:pi.own,q:q!=null?1:0,n:kg}}

function showLogin(err){let el=$('#login');if(!el){el=document.createElement('div');el.id='login';el.style.cssText='position:fixed;inset:0;z-index:999;background:var(--bg,Canvas);overflow:auto';document.body.appendChild(el)}el.innerHTML=loginView(err)}
function hideLogin(){const el=$('#login');if(el)el.remove()}
document.addEventListener('submit',ev=>{if(ev.target.id!=='lf')return;ev.preventDefault();const b=ev.target.querySelector('button');b.disabled=true;$('#lerr').textContent='';
 firebase.auth().signInWithEmailAndPassword($('#le').value.trim(),$('#lp').value).catch(e=>{b.disabled=false;$('#lerr').textContent=authErr(e)})});
async function fbBoot(){
 if(!window.FB_CONFIG||!FB_CONFIG.apiKey||/ВСТАВЬ/.test(FB_CONFIG.apiKey)){showLogin('Не заполнен config.js — вставьте туда настройки Firebase.');return}
 firebase.initializeApp(FB_CONFIG);
 const fs=firebase.firestore();
 try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
 S.fb=true;
 firebase.auth().getRedirectResult().catch(e=>{const t=authErr(e);if(t)setTimeout(()=>{const el=$('#lerr');if(el)el.textContent=t},300)});
 firebase.auth().onAuthStateChanged(u=>{
  if(!u){[...unsubs,...wkUnsubs,...gUnsubs].forEach(x=>{try{x()}catch(e){}});unsubs=[];wkUnsubs=[];gUnsubs=[];store=Local;DB=null;S.mode='local';S.user=null;S.kid=null;S.kdoc=null;S.kitchens=null;showLogin();return}
  hideLogin();S.user=u.email;S.uname=(u.displayName||'').split(' ')[0];DB=fs;store=Remote;S.mode='db';S.kid=null;
  startKitchens();render();
 });
}
(async()=>{
 try{
  if(window.firebase&&window.FB_CONFIG!==undefined){await fbBoot();return}
  const use=window.claude&&window.claude.use;if(!use)return;
  const db=await window.claude.use('db');if(!db)return;
  DB=db;store=Remote;S.mode='db';
  loadTimer=setTimeout(()=>{stale=true;banner()},10000);
  subscribeAll();render();
 }catch(e){console.warn(e)}
})();
}

</script>
</body>
</html>
